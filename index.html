<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Visual save editor for Charlie Murder (Steam/PC). Edit clothing stats, special bonuses, food and character sheets in your browser." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e0b0c" />
    <link rel="canonical" href="https://barbxsa.com.br/charlie-murder-save-editor/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Charlie Murder Save Editor" />
    <meta property="og:description" content="Edit Charlie Murder (Steam/PC) clothing stats, special bonuses, food and character sheets in your browser. EN / ES / PT-BR." />
    <meta property="og:url" content="https://barbxsa.com.br/charlie-murder-save-editor/" />
    <meta property="og:image" content="https://barbxsa.com.br/charlie-murder-save-editor/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Charlie Murder Save Editor</title>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="paint" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="paint-soft" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="3" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" seed="2" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
